name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same toolchain/libc as release.yml (Alpine, musl): libc-specific
      # behaviour (e.g. ether_ntoa_r spelling) must show up here, not in a
      # release build. Rootless tests only; the interface-lifecycle test
      # (make system-test) needs root + netns and is run by hand.
      - name: Build + tests (Alpine / musl)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.24 sh -c '
            apk add --no-cache gcc musl-dev linux-headers make &&
            make && make test'
