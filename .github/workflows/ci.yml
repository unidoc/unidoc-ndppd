name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rootless unit tests only. The interface-lifecycle test
      # (make system-test) needs root + netns and is run by hand.
      - name: Build + unit tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make libc-dev
          make
          make test
