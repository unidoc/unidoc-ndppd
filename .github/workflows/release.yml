name: Release

# Triggered by pushing a version tag (v1.0.0, v1.1.0, ...). Builds fully
# static Linux binaries only (amd64 + arm64) - one binary works on any
# distro, musl or glibc, per the README's own build claim. FreeBSD
# binaries are not built here (no FreeBSD support in GitHub-hosted
# runners) - build those locally and `gh release upload <tag> <file>`
# them onto the same release afterward.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            # Native runner, not QEMU: we're actually compiling C here, so
            # this avoids needing a cross-compiler/sysroot entirely.
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      # No job-level `container:` here on purpose: actions/checkout and
      # actions/upload-artifact are JS actions, and GitHub only bundles a
      # Node runtime for x64 Alpine containers - on the arm64 runner that
      # fails with "JavaScript Actions in Alpine containers are only
      # supported on x64 Linux runners". Checkout/upload run natively on
      # the host instead; only the actual compile+verify happens inside a
      # throwaway Alpine container via `docker run` (Docker is preinstalled
      # on GitHub-hosted runners, x64 and arm64 alike).
      - name: Build + verify in Alpine container
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.24 sh -c '
            set -e
            # linux-headers provides <linux/filter.h> (BPF) that iface.c
            # needs - not part of musl-dev, easy to miss since a dev
            # machine often has it installed already for unrelated reasons.
            apk add --no-cache gcc musl-dev linux-headers make file
            make VERSION=${{ github.ref_name }}
            file bin/unidoc-ndppd
            ! readelf -l bin/unidoc-ndppd | grep -q INTERP
          '

      - name: Rename artifact
        run: |
          mkdir -p out
          cp bin/unidoc-ndppd out/unidoc-ndppd-${{ github.ref_name }}-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: unidoc-ndppd-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: unidoc-ndppd ${{ github.ref_name }}
          body: |
            Static Linux binaries (amd64 + arm64), musl and glibc compatible.

            FreeBSD binaries are added manually after this release is
            created - if they're not attached yet, they're coming.
          generate_release_notes: true
          files: |
            dist/*
